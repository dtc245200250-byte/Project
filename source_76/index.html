<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Responsive Gallery - Bootstrap</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>
<body class="bg-light">
    <main class="container py-5">
        <header class="text-center mb-4">
            <h1 class="fw-bold">Responsive Gallery</h1>
            <p class="text-secondary mb-0">
                Bootstrap Grid System: 4 ảnh Desktop, 2 ảnh Tablet, 1 ảnh Mobile.
            </p>
        </header>

        <div class="row g-4">
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card h-100 shadow-sm">
                    <img
                        src="https://picsum.photos/id/1015/800/600"
                        class="card-img-top img-fluid"
                        alt="Phong cảnh núi và hồ"
                    >
                </div>
            </div>

            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card h-100 shadow-sm">
                    <img
                        src="https://picsum.photos/id/1016/800/600"
                        class="card-img-top img-fluid"
                        alt="Phong cảnh thiên nhiên"
                    >
                </div>
            </div>

            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card h-100 shadow-sm">
                    <img
                        src="https://picsum.photos/id/1020/800/600"
                        class="card-img-top img-fluid"
                        alt="Đường đi giữa rừng"
                    >
                </div>
            </div>

            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card h-100 shadow-sm">
                    <img
                        src="https://picsum.photos/id/1024/800/600"
                        class="card-img-top img-fluid"
                        alt="Chú chó trong thiên nhiên"
                    >
                </div>
            </div>

            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card h-100 shadow-sm">
                    <img
                        src="https://picsum.photos/id/1025/800/600"
                        class="card-img-top img-fluid"
                        alt="Cận cảnh một chú chó"
                    >
                </div>
            </div>

            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card h-100 shadow-sm">
                    <img
                        src="https://picsum.photos/id/1035/800/600"
                        class="card-img-top img-fluid"
                        alt="Cây cầu giữa thiên nhiên"
                    >
                </div>
            </div>

            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card h-100 shadow-sm">
                    <img
                        src="https://picsum.photos/id/1043/800/600"
                        class="card-img-top img-fluid"
                        alt="Phong cảnh núi đá"
                    >
                </div>
            </div>

            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card h-100 shadow-sm">
                    <img
                        src="https://picsum.photos/id/1069/800/600"
                        class="card-img-top img-fluid"
                        alt="Phong cảnh bờ biển"
                    >
                </div>
            </div>
        </div>
    </main>
</body>
</html>
